<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixel Title Generator</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell"><section class="panel controls-panel"><div class="brand-row"><h1>Title Generator</h1><span class="status-dot"></span></div><label class="field"><span>Text</span><textarea id="textInput" rows="4" maxlength="80" spellcheck="false">pixel title</textarea></label><label class="field"><span>Sprite sheet</span><select id="atlasSelect"></select></label><div class="field"><div class="field-label-row"><span>Letter spacing</span><output id="spacingValue">2 px</output></div><input id="spacingInput" type="range" min="-4" max="24" value="2" step="1"></div><div class="field"><div class="field-label-row"><span>Hue</span><output id="hueValue">0°</output></div><input id="hueInput" type="range" min="0" max="360" value="0"></div><div class="field"><div class="field-label-row"><span>Saturation</span><output id="saturationValue">100%</output></div><input id="saturationInput" type="range" min="0" max="200" value="100"></div><div class="field"><div class="field-label-row"><span>Brightness</span><output id="brightnessValue">100%</output></div><input id="brightnessInput" type="range" min="20" max="200" value="100"></div><div class="field"><div class="field-label-row"><span>Opacity</span><output id="opacityValue">100%</output></div><input id="opacityInput" type="range" min="10" max="100" value="100"></div><label class="field"><span>Export scale</span><div class="scale-grid"><button class="scale-button active" type="button" data-scale="2">2x</button><button class="scale-button" type="button" data-scale="3">3x</button><button class="scale-button" type="button" data-scale="5">5x</button></div></label><label class="field"><span>Custom width in pixels</span><input id="customWidth" type="number" min="1" step="1" placeholder="Example: 1024"></label><button id="downloadButton" class="download-button" type="button">Download PNG</button></section><section class="panel preview-panel"><div class="preview-header"><div><p class="eyebrow">PREVIEW</p><h2>Generated title</h2></div><div class="preview-actions"><button id="zoomOut" type="button">−</button><span id="zoomValue">100%</span><button id="zoomIn" type="button">+</button><button id="zoomReset" type="button">Reset</button><span id="sizeLabel">0 × 0 px</span></div></div><div class="canvas-wrap" id="canvasWrap"><div id="canvasStage"><canvas id="titleCanvas"></canvas></div></div><p id="notice" class="notice"></p></section></main><script src="script.js"></script></body></html>
